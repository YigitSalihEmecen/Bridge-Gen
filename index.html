<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bridge Generator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "fflate": "https://cdn.jsdelivr.net/npm/fflate@0.8.2/esm/browser.js"
      }
    }
  </script>
  <style>
    :root {
      --bg: #f0eee6;
      --panel: #faf9f5;
      --ink: #141413;
      --muted: #6f6e68;
      --faint: #a3a19a;
      --line: #e3e0d6;
      --chip: #ebe8df;
      --accent: #c96442;
      --accent-soft: #f2e2d9;
      --serif: 'Source Serif 4', Georgia, serif;
      --sans: 'Inter', system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    body { display: grid; grid-template-columns: 360px 1fr; overflow: hidden; }
    button, input { font: inherit; color: inherit; }

    .panel { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
    .scroll { overflow-y: auto; padding: 28px 24px 12px; flex: 1; scrollbar-width: thin; }
    header h1 { font: 500 26px/1.15 var(--serif); letter-spacing: -0.01em; margin: 0 0 6px; }
    header p { color: var(--muted); margin: 0 0 24px; max-width: 30ch; }

    .group { margin-top: 26px; }
    .group > h2 { font: 500 11px/1 var(--sans); text-transform: uppercase; letter-spacing: 0.08em; color: var(--faint); margin: 0 0 12px; }

    .types { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .type { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; transition: border-color .15s, background .15s; }
    .type b { display: block; font: 500 15px/1.2 var(--serif); }
    .type span { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }
    .type:hover { border-color: #cfcbbf; }
    .type[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--panel); }
    .type[aria-pressed="true"] span { color: #bdbab0; }

    .row { margin-bottom: 14px; }
    .row[hidden] { display: none; }
    .row .head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .row label { color: var(--ink); }
    .val { display: flex; align-items: baseline; gap: 3px; color: var(--muted); }
    .val input { width: 64px; text-align: right; border: 0; background: transparent; font-variant-numeric: tabular-nums; padding: 0; outline: none; color: var(--ink); }
    .val input:focus { box-shadow: 0 1px 0 var(--accent); }

    input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 18px; background: transparent; margin: 0; cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 2px; background: linear-gradient(var(--ink), var(--ink)) 0/var(--p, 0%) 100% no-repeat, var(--line); border-radius: 2px; }
    input[type=range]::-moz-range-track { height: 2px; background: var(--line); }
    input[type=range]::-moz-range-progress { height: 2px; background: var(--ink); }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--ink); margin-top: -6px; transition: transform .12s; }
    input[type=range]::-moz-range-thumb { width: 12px; height: 12px; border-radius: 50%; background: var(--panel); border: 1.5px solid var(--ink); }
    input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); background: var(--accent); border-color: var(--accent); }

    .seg { display: flex; background: var(--chip); border-radius: 8px; padding: 2px; }
    .seg button { flex: 1; border: 0; background: transparent; padding: 5px 6px; border-radius: 6px; cursor: pointer; color: var(--muted); }
    .seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 1px 2px rgba(20, 20, 19, .08); }

    .switch { display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .switch input { appearance: none; -webkit-appearance: none; width: 30px; height: 18px; border-radius: 9px; background: var(--line); position: relative; cursor: pointer; transition: background .15s; margin: 0; }
    .switch input::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.15); }
    .switch input:checked { background: var(--ink); }
    .switch input:checked::after { transform: translateX(12px); }

    .color { display: flex; align-items: center; justify-content: space-between; }
    .color input { width: 34px; height: 22px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: none; cursor: pointer; }
    .color input::-webkit-color-swatch-wrapper { padding: 2px; }
    .color input::-webkit-color-swatch { border: 0; border-radius: 4px; }

    .export { border-top: 1px solid var(--line); padding: 16px 24px 20px; display: grid; gap: 8px; }
    .btn { border-radius: 10px; padding: 11px 14px; cursor: pointer; font-weight: 500; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; gap: 8px; transition: opacity .15s, background .15s; }
    .btn.primary { background: var(--ink); color: var(--panel); }
    .btn.primary:hover { background: #2b2a27; }
    .btn.ghost { background: transparent; border-color: var(--line); }
    .btn.ghost:hover { border-color: #cfcbbf; }
    .btn:disabled { opacity: .45; cursor: progress; }
    .fine { color: var(--faint); font-size: 11.5px; margin: 2px 0 0; text-align: center; }

    .stage { position: relative; min-width: 0; min-height: 0; }
    #view { display: block; width: 100%; height: 100%; outline: none; }
    .hud { position: absolute; left: 20px; bottom: 18px; display: flex; gap: 8px; align-items: center; }
    .pill { background: rgba(250, 249, 245, .86); backdrop-filter: blur(8px); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .pill b { color: var(--ink); font-weight: 500; }
    button.pill { cursor: pointer; color: var(--ink); }
    .hint { position: absolute; right: 20px; bottom: 22px; color: var(--faint); font-size: 11.5px; }

    #loading { position: absolute; inset: 0; display: grid; place-items: center; background: var(--bg); transition: opacity .4s; }
    #loading.done { opacity: 0; pointer-events: none; }
    #loading .box { text-align: center; }
    #loading h3 { font: 400 22px var(--serif); margin: 0 0 14px; }
    #loading .bar { width: 220px; height: 2px; background: var(--line); margin: 0 auto 10px; overflow: hidden; border-radius: 2px; }
    #loading .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .2s; }
    #loading small { color: var(--muted); }

    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; grid-template-rows: 52vh 1fr; overflow: auto; height: auto; }
      .stage { grid-row: 1; height: 52vh; }
      .panel { grid-row: 2; border-right: 0; border-top: 1px solid var(--line); }
      .scroll { padding: 22px 16px 8px; }
      .export { padding: 14px 16px 18px; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <div class="scroll">
      <header>
        <h1>Bridge Generator</h1>
        <p>Parametric, game-ready bridges with parallax-mapped PBR materials.</p>
      </header>
      <div class="types" id="types"></div>
      <div id="controls"></div>
    </div>
    <div class="export">
      <button class="btn primary" id="export-glb" disabled>Export GLB</button>
      <button class="btn ghost" id="export-zip" disabled>Export ZIP · GLB + texture maps</button>
      <p class="fine">Meters, Y-up · embedded PBR · height maps in ZIP</p>
    </div>
  </aside>
  <main class="stage">
    <canvas id="view" tabindex="0"></canvas>
    <div class="hud">
      <span class="pill" id="stats">—</span>
      <button class="pill" id="frame" title="Frame bridge (F)">Frame</button>
    </div>
    <div class="hint">Drag to orbit · right-drag to pan · scroll to zoom</div>
    <div id="loading">
      <div class="box">
        <h3>Baking materials</h3>
        <div class="bar"><i id="progress"></i></div>
        <small id="progress-label">Preparing</small>
      </div>
    </div>
  </main>
  <script type="module" src="./src/app.js"></script>
</body>
</html>
